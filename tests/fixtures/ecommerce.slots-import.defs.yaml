# Imported by ecommerce.slots-import.yaml.
# Define the reusable top-level `slots:` (and any `enums:`, e.g. order_status) here.
# Slot-based ecommerce — SINGLE FILE, no imports.
# Define top-level `slots:` and have each class reference them via `slots: [...]`
# (use `slot_usage` for any per-class overrides). No `attributes:`.
# Goal: produce the same canvas as ../../examples/ecommerce.linkml.yaml
# (compared against ecommerce.canvas.json). See README.md.

id: https://example.org/ecommerce
name: ecommerce
title: E-Commerce Store
description: Example LinkML schema describing a small online store.
default_range: string

prefixes:
  linkml: https://w3id.org/linkml/

slots:
  id:
    identifier: true
    range: integer
  email:
    range: string
    required: true
  full_name:
    range: string
    required: true
  created_at:
    range: datetime
  customer:
    range: Customer
    required: true
  line1:
    range: string
    required: true
  city:
    range: string
  country:
    range: string
  name:
    range: string
    required: true
  parent:
    range: Category
  sku:
    range: string
    required: true
  price_cents:
    range: integer
    required: true
  category:
    range: Category
  ship_to:
    range: Address
  status:
    range: order_status
  placed_at:
    range: datetime
  order:
    range: Order
    required: true
  product:
    range: Product
    required: true
  quantity:
    range: integer
    required: true
  unit_price_cents:
    range: integer
