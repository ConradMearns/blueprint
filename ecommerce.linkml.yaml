id: https://example.org/ecommerce
name: ecommerce
title: E-Commerce Store
description: Example LinkML schema describing a small online store.
default_range: string

prefixes:
  linkml: https://w3id.org/linkml/

classes:
  Customer:
    description: A registered shopper.
    attributes:
      id:
        identifier: true
        range: integer
      email:
        range: string
        required: true
      full_name:
        range: string
        required: true
      created_at:
        range: datetime

  Address:
    description: A shipping or billing address.
    attributes:
      id:
        identifier: true
        range: integer
      customer:
        range: Customer
        required: true
      line1:
        range: string
        required: true
      city:
        range: string
      country:
        range: string

  Category:
    description: A product category (can nest via parent).
    attributes:
      id:
        identifier: true
        range: integer
      name:
        range: string
        required: true
      parent:
        range: Category

  Product:
    description: An item for sale.
    attributes:
      id:
        identifier: true
        range: integer
      sku:
        range: string
        required: true
      name:
        range: string
        required: true
      price_cents:
        range: integer
        required: true
      category:
        range: Category

  OrderLine:
    description: A single line item within an order.
    attributes:
      id:
        identifier: true
        range: integer
      # order:
      #   range: Order
      #   required: true
      product:
        range: Product
        required: true
      quantity:
        range: integer
        required: true
      unit_price_cents:
        range: integer

enums:
  order_status:
    permissible_values:
      pending:
      paid:
      shipped:
      cancelled:
