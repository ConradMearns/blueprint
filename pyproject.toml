[project]
name = "linkml-herd"
version = "0.1.0"
description = "Render a LinkML schema as an editable ER diagram in one static HTML file (or SVG)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]
keywords = ["linkml", "erd", "er-diagram", "entity-relationship", "schema", "diagram", "svg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/ConradMearns/linkml-herd"
Issues = "https://github.com/ConradMearns/linkml-herd/issues"

[project.scripts]
linkml-herd = "linkml_herd.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
